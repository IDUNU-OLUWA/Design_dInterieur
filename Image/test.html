<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
    <style>
        .Portfolio_page{ position:relative; height:350px; overflow:hidden; border-radius:12px; }
        .Portfolio_page img{ width:100%; height:100%; object-fit:cover; }
        .portfolio_box{ position:absolute; bottom:0; left:0; width:100%; padding:20px; background:linear-gradient(to top, rgba(0,0,0,0.8), transparent); color:white; }
    </style>
</head>
<body>

    <div class="splide Portfolio_Splide">
        <div class="splide__track">
            <ul class="splide__list">
                <li class="splide__slide"><div class="Portfolio_page"><img src="https://picsum.photos/400/350?random=1"><div class="portfolio_box"><h3>Interior</h3></div></div></li>
                <li class="splide__slide"><div class="Portfolio_page"><img src="https://picsum.photos/400/350?random=2"><div class="portfolio_box"><h3>Interior</h3></div></div></li>
                <li class="splide__slide"><div class="Portfolio_page"><img src="https://picsum.photos/400/350?random=3"><div class="portfolio_box"><h3>Interior</h3></div></div></li>
                <li class="splide__slide"><div class="Portfolio_page"><img src="https://picsum.photos/400/350?random=4"><div class="portfolio_box"><h3>Interior</h3></div></div></li>
            </ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            new Splide('.Portfolio_Splide', {
                type: 'loop',
                perPage: 4,
                perMove: 1,
                autoplay: true,
                interval: 2000,
                pagination: false,
                arrows: false,
                gap: '15px',
                breakpoints: {
                    1000: { perPage: 3 },
                    768: { perPage: 2 },
                    500: { perPage: 1 }
                }
            }).mount();
        });
    </script>
</body>
</html>
